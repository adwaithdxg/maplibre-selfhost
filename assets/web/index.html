<!DOCTYPE html>
<!--
  Self-test viewer for the self-hosted MapLibre stack.
  Served by Nginx at "/". Confirms tiles, glyphs and the style all load from
  this deployment. ${PUBLIC_URL} is templated at generation time (empty ->
  root-relative, which works on any host).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MapLibre Self-Hosted — Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    .badge {
      position: absolute; z-index: 1; top: 10px; left: 10px;
      background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 6px;
      font: 13px/1.4 system-ui, sans-serif; color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>
  <div class="badge">Self-hosted MapLibre · GCC basemap</div>
  <div id="map"></div>
  <script>
    // ${PUBLIC_URL} -> absolute base (cross-origin) or "" (same-origin).
    const BASE = "${PUBLIC_URL}";
    const map = new maplibregl.Map({
      container: "map",
      style: BASE + "/style.json",
      center: [50.55, 25.93],   // Persian Gulf — centers on the GCC region
      zoom: 5,
      hash: true
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");
    map.addControl(new maplibregl.ScaleControl({ unit: "metric" }));
    map.on("error", (e) => console.error("MapLibre error:", e && e.error));
  </script>
</body>
</html>

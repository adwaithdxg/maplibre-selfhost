# =============================================================================
#  nginx.conf — main configuration (template)
# -----------------------------------------------------------------------------
#  Rendered by scripts/nginx-entrypoint.sh: ${NGINX_TILE_CACHE_MAX} and
#  ${NGINX_RATE_LIMIT} are substituted from the environment. All other $vars
#  are native Nginx runtime variables and are left untouched.
# =============================================================================

# Load Brotli dynamic modules (compiled in docker/nginx/Dockerfile).
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

# One worker per CPU core; auto-detects the container's CPU quota.
worker_processes auto;
worker_rlimit_nofile 65535;

# Send fatal startup errors + master logs to stderr (captured by Docker).
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Tuning -------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;                 # hide nginx version
    types_hash_max_size 2048;
    client_max_body_size 1m;
    reset_timedout_connection on;

    # Resolver for re-resolving the "martin" service name if it restarts
    # (Docker's embedded DNS). valid=10s keeps it fresh without hammering DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Logging ------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt="$upstream_response_time" '
                    'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ---- Compression --------------------------------------------------------
    # NOTE: vector tiles (.pbf) are already gzip-encoded inside the MBTiles and
    # served with Content-Encoding: gzip by Martin, so Nginx will NOT
    # re-compress them. Compression below targets JSON/CSS/JS/SVG/glyphs.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types      application/json application/javascript text/css text/plain
                    application/x-protobuf image/svg+xml application/manifest+json;

    brotli            on;
    brotli_comp_level 6;
    brotli_static     on;
    brotli_types      application/json application/javascript text/css text/plain
                      application/x-protobuf image/svg+xml application/manifest+json;

    # ---- Edge tile/glyph cache ---------------------------------------------
    # Tiles and glyphs are immutable for a given tileset build, so we cache
    # them aggressively on disk. max_size is env-driven; inactive evicts cold
    # entries. use_temp_path=off writes straight into the cache tree.
    proxy_cache_path /var/cache/nginx/tiles
                     levels=1:2
                     keys_zone=tile_cache:100m
                     max_size=${NGINX_TILE_CACHE_MAX}
                     inactive=60d
                     use_temp_path=off;

    # ---- Rate limiting ------------------------------------------------------
    # Per-IP request rate for tile endpoints; burst is applied per-location.
    limit_req_zone  $binary_remote_addr zone=tile_limit:20m rate=${NGINX_RATE_LIMIT};
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # ---- Upstreams + server blocks (rendered into conf.d) -------------------
    include /etc/nginx/conf.d/*.conf;
}

# =============================================================================
#  ssl-params.conf — modern, A+-grade TLS settings
# =============================================================================
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;                  # let modern clients choose (TLS1.3)
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Session resumption (tickets off for forward secrecy).
ssl_session_cache    shared:SSL:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;

# OCSP stapling (skipped automatically for the bootstrap self-signed cert).
ssl_stapling         on;
ssl_stapling_verify  on;

# Larger TLS buffer is fine for tile payloads.
ssl_buffer_size      16k;

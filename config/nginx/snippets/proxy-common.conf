# =============================================================================
#  proxy-common.conf — shared reverse-proxy settings for Martin upstreams
# =============================================================================
proxy_http_version 1.1;
proxy_set_header   Connection "";                 # reuse keepalive pool
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;

# Fail fast on a dead upstream; retry the next one in the pool.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
proxy_next_upstream   error timeout http_502 http_503 http_504;

# Response buffering (smooths slow clients, enables caching).
proxy_buffering         on;
proxy_buffers           16 16k;
proxy_busy_buffers_size 32k;

# Ignore upstream Cache-Control/Expires that would defeat our edge cache;
# we set freshness explicitly per-location.
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header    Set-Cookie;

# Strip ANY CORS headers coming from the upstream (Martin). Nginx is the single
# CORS authority and re-adds exactly one set per location. Without this, if the
# upstream also emits Access-Control-Allow-Origin, the response carries it twice
# ("*, *") and browsers reject it with a CORS error.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;

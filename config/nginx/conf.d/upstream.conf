# =============================================================================
#  upstream.conf — Martin tile-server backend pool
# -----------------------------------------------------------------------------
#  HORIZONTAL SCALING: to add more tile-server capacity, run additional Martin
#  replicas (e.g. martin-2, martin-3 in docker-compose.yml or via
#  `docker compose up --scale`) and list them here. Nginx least-connection
#  balances across them; the edge cache absorbs most read traffic regardless.
# =============================================================================
upstream martin_backend {
    # Shared memory zone enables runtime re-resolution of the "martin" name.
    zone martin_backend 64k;

    # Least-connections suits variable tile render times better than round-robin.
    least_conn;

    # "resolve" makes Nginx (1.27.3+) re-query Docker DNS per `resolver ... valid`,
    # so a restarted/replaced Martin container's new IP is picked up with no
    # reload. Add siblings for scale-out:
    #   server martin-2:3000 resolve max_fails=3 fail_timeout=10s;
    server martin:3000 resolve max_fails=3 fail_timeout=10s;

    # Keep idle upstream connections warm to cut per-request latency.
    keepalive 64;
}
